# Agent Teams (WhaleForce) profile layer - manual enabler.
# Updated for DSH 0.2.2-rc.3: plugin row ids now come from dsh-base / dsh-web-app
# (agent-team, tool-agent-team, tool-subagent-control, tool-subagent,
# tool-subagent-fork, ui-agent-team, ui-subagent). The retired
# tool-subagent-list-agents row no longer exists in 0.2.2-rc.3 and is dropped.
#
# Apply after dsh-base/dsh-web-app so these replacements keep direct delegation
# and coordination on the WhaleForce Team tools.
#
# Enable EITHER the built-in Agent Teams rows OR this WhaleForce bundle - not
# both - otherwise two agentTeams services / two team tool sets compete in one
# session.

- id: agent-team
  disabled: true

- id: tool-agent-team
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: ui-agent-team
  disabled: true

- id: ui-subagent
  disabled: true

- insert:
    - id: agent-team-whaleforce
      name: dsh-agent-team-whaleforce-core
      config:
        maxMembers: 64
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000

    - id: tool-agent-team-whaleforce
      name: dsh-agent-team-whaleforce-tools
      config:
        freshProvider: spawn
        forkProvider: fork

    - id: ui-agent-team-whaleforce
      name: dsh-agent-team-whaleforce-ui

    - id: ui-agent-team-whaleforce-sessions
      name: dsh-agent-team-whaleforce-sessions
