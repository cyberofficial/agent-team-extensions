# Agent Teams (WhaleForce) profile layer — manual enabler.
# Cloned from @deepseek-ai/dsh-experimental-agent-team-profile v0.2.0-rc.2
# (cordis.patch.yml). Apply after dsh-base so these replacements keep direct
# delegation and coordination on the WhaleForce Team tools.
#
# Enable EITHER the original Agent Teams bundle OR this WhaleForce bundle — not both —
# otherwise two sets of team tools compete in one session.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- insert:
    - id: agent-team-whaleforce
      name: dsh-agent-team-whaleforce-core
      config:
        maxMembers: 64
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000

    - id: tool-agent-team-whaleforce
      name: dsh-agent-team-whaleforce-tools
      config:
        freshProvider: spawn
        forkProvider: fork

    - id: ui-agent-team-whaleforce
      name: dsh-agent-team-whaleforce-ui
