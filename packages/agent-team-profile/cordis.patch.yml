# Agent Teams WhaleForce profile layer. Apply after dsh-base so these replacements
# keep direct delegation and coordination on the Team tools.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: ui-subagent
  disabled: true

- insert:
    - id: agent-team-whaleforce
      name: 'dsh-agent-team-whaleforce-core'
      config:
        maxMembers: 64
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000

    - id: tool-agent-team-whaleforce
      name: 'dsh-agent-team-whaleforce-tools'
      config:
        freshProvider: spawn
        forkProvider: fork

    - id: ui-agent-team-whaleforce
      name: 'dsh-agent-team-whaleforce-ui'

    - id: ui-agent-team-whaleforce-sessions
      name: 'dsh-agent-team-whaleforce-sessions'
