# Agent Teams WhaleForce profile layer. Apply after dsh-base/dsh-web-app so these
# replacements keep direct delegation and coordination on the Team tools.
# Updated for DSH 0.2.2-rc.3 row ids (tool-subagent-list-agents is retired).

- id: agent-team
  disabled: true

- id: tool-agent-team
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: ui-agent-team
  disabled: true

- id: ui-subagent
  disabled: true

- insert:
    - id: agent-team-whaleforce
      name: 'dsh-agent-team-whaleforce-core'
      config:
        maxMembers: 64
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000
        # Opt-in name reuse for delete-and-recreate flows such as cut-point
        # compaction. Deployment default only: the operator switch in the Team
        # panel stores a runtime override at
        # $DSH_HOME/dsh-plugin-agent-team-whaleforce-core.json and wins when set.
        allowNameReuse: false

    - id: tool-agent-team-whaleforce
      name: 'dsh-agent-team-whaleforce-tools'
      config:
        freshProvider: spawn
        forkProvider: fork

    - id: ui-agent-team-whaleforce
      name: 'dsh-agent-team-whaleforce-ui'

    - id: ui-agent-team-whaleforce-sessions
      name: 'dsh-agent-team-whaleforce-sessions'
