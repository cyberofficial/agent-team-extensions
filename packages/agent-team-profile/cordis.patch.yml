# Agent Teams clone profile layer. Apply after dsh-base so these replacements
# keep direct delegation and coordination on the Team tools.

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- insert:
    - id: agent-team-clone
      name: 'dsh-agent-team-clone-core'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000

    - id: tool-agent-team-clone
      name: 'dsh-agent-team-clone-tools'
      config:
        freshProvider: spawn
        forkProvider: fork

    - id: ui-agent-team-clone
      name: 'dsh-agent-team-clone-ui'
